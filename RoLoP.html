<style>

.grow{display:flex;gap:6px;width:100%}.grow .gb:first-child{flex:1}.gb.sm{padding:8px 10px;font-size:12px;white-space:nowrap}.gb.dn{border-color:#ff5470;color:#ff5470}

html,body{width:100%;max-width:100vw;height:100%;max-height:100dvh;overflow:hidden;margin:0}

<script>
/* Settings (all optional):
   GOOGLE_CLIENT_ID  - only for the no-server mode: paste an OAuth Web Client ID to turn on the Google button.
                       (When you run server.js, set the GOOGLE_CLIENT_ID environment variable on the server instead.)
   ROLOP_SERVER      - only if the game page is hosted somewhere other than server.js, e.g. 'wss://my-server.example.com/ws' */
var GOOGLE_CLIENT_ID='';
var ROLOP_SERVER='';
window.ROLOP_CONFIG={googleClientId:GOOGLE_CLIENT_ID,server:ROLOP_SERVER};
</script>
<script>
/* RoLoP standalone layer.
   Gives the game the same claude.use('user'|'db'|'room') API it has on Claude, using:
   - a sign-in screen (email + password, or Google) whose accounts are stored in this browser,
   - localStorage for profiles, shop items and saved games,
   - BroadcastChannel (tabs on this computer) and PeerJS room codes (online) for multiplayer. */
function makeClaude(env){
  var LS=env.storage,BCc=env.BC,doc=env.document,PeerC=env.Peer,prune=env.pruneMs||4000,retryMs=env.retryMs||2500,CFG=env.config||{},WSC=env.WS,S=null;
  function ld(k,d){try{var v=LS.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function sv(k,v){try{LS.setItem(k,JSON.stringify(v));}catch(e){}}
  function freeze(o){if(o&&typeof o==='object'){Object.freeze(o);Object.keys(o).forEach(function(k){freeze(o[k]);});}return o;}
  function rnd(n){var a='';while(a.length<n)a+=Math.random().toString(36).slice(2);return a.slice(0,n);}
  function hp(p,s){var t=s+':'+p;
    if(env.subtle&&typeof TextEncoder!=='undefined')return env.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});
    var h=5381,i;for(i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return Promise.resolve('w'+(h>>>0).toString(16));}
  /* ---------- server link (used automatically when this page is served by server.js) ---------- */
  function detect(){return new Promise(function(res){var url=CFG.server||((typeof location!=='undefined'&&/^https?:$/.test(location.protocol))?(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws':null);
    if(!url||!WSC)return res(null);var ws,done=false,to=setTimeout(function(){fin(null);},2500);
    function fin(v){if(done)return;done=true;clearTimeout(to);if(!v&&ws)try{ws.close();}catch(e){}res(v);}
    try{ws=new WSC(url);}catch(e){return fin(null);}ws.onopen=function(){fin({ws:ws,url:url});};ws.onerror=function(){fin(null);};});}
  function makeSrv(m){var ws=m.ws,url=m.url,rid=0,pend={},hs={},hooks=[],api={room:null};
    function attach(w){ws=w;w.onmessage=function(e){var d;try{d=JSON.parse(e.data);}catch(x){return;}
        if(d.rid&&pend[d.rid]){var p=pend[d.rid];delete pend[d.rid];if(d.ok)p.res(d);else p.rej(new Error(d.err||'Error'));}else if(d.t&&hs[d.t])hs[d.t].forEach(function(f){f(d);});};
      w.onclose=function(){Object.keys(pend).forEach(function(k){pend[k].rej(new Error('Connection lost'));delete pend[k];});setTimeout(recon,1500);};}
    function recon(){var w;try{w=new WSC(url);}catch(e){return setTimeout(recon,3000);}w.onopen=function(){attach(w);hooks.forEach(function(f){f();});};w.onerror=function(){};w.onclose=function(){setTimeout(recon,3000);};}
    api.req=function(t,d){return new Promise(function(res,rej){if(!ws||ws.readyState!==1)return rej(new Error('Not connected to the server.'));var id=++rid;pend[id]={res:res,rej:rej};ws.send(JSON.stringify(Object.assign({rid:id,t:t},d||{})));});};
    api.send=function(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
    api.on=function(t,f){(hs[t]=hs[t]||[]).push(f);};
    hooks.push(function(){var t=ld('rolop_tok',null);if(t)api.req('resume',{token:t}).then(function(){if(api.room)api.req('join',{room:api.room});}).catch(function(){});});
    attach(ws);return api;}
  /* ---------- accounts: email + password, or Google; then the game asks for a player name + profile password ---------- */
  var accts=ld('rolop_acct',{}),sess=ld('rolop_session',null),uid=null,who='';
  function jwt(t){try{var b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b))));}catch(e){return null;}}
  function E(tag,css,text){var e=doc.createElement(tag);if(css)e.style.cssText=css;if(text)e.textContent=text;return e;}
  var INP='padding:11px;border-radius:8px;border:1px solid rgba(0,229,255,.4);background:#0e1424;color:#e8f1ff;font-size:16px;width:100%;box-sizing:border-box;font-family:inherit',
      BTN='padding:12px;border:0;border-radius:10px;background:#00e5ff;color:#001018;font-weight:700;font-size:16px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-family:inherit',
      BTN2=BTN.replace('#00e5ff','#2b3350').replace('#001018','#e8f1ff');
